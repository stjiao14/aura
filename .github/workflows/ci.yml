name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS dependencies
        run: npm ci

      - name: Run all tests
        run: npm run test:all
        env:
          # whisper.cpp/ggml uses ARM intrinsics (i8mm) that require knowing the
          # exact CPU. Without this, cmake gets a generic arm64 target and fails.
          # -mcpu=native matches local dev behavior (auto-detect runner's chip).
          CFLAGS: "-mcpu=native"
          CXXFLAGS: "-mcpu=native"
