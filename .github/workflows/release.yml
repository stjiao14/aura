name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release-macos:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Aura ${{ github.ref_name }}"
          releaseBody: |
            ## Install

            1. Download `Aura_*.dmg` below.
            2. Open the DMG and drag Aura to Applications.
            3. **First launch**: right-click Aura → Open → Open to bypass Gatekeeper.
               (This one-time prompt is normal for apps distributed outside the Mac App Store.)
            4. Grant Microphone access when prompted. For system audio capture, grant
               Screen Recording in System Settings → Privacy & Security.
          releaseDraft: true
          args: --target universal-apple-darwin
